# TinyTapeout SKY130 Project Info
# See https://tinytapeout.com for documentation

project:
  title:      "Multi-Function Security & Integrity Engine"
  author:     "Chidam"
  discord:    ""
  description: "8-in/8-out ASIC security co-processor with four modes: CRC-8/MAXIM accumulator, Galois LFSR PRNG (poly 0xB8), Hamming(8,4) syndrome generator with full parity, and bit-reversal with 6-bit population count. Mode selected via ui_in[7:6]; data on ui_in[5:0]."
  language:   "Verilog"
  clock_hz:   10000000   # 10 MHz nominal; supports up to 50 MHz

  # Your top module name must start with "tt_um_"
  top_module: "tt_um_chidam_secengine"

  # Source files in ./src — list each file separately
  source_files:
    - tt_um_chidam_secengine.v

  # Tile dimensions (1x1 = 160x100 um on SKY130 ChipFoundry)
  tiles: "1x1"

documentation:
  pinout:
    ui[0]: "Data bit 0"
    ui[1]: "Data bit 1"
    ui[2]: "Data bit 2"
    ui[3]: "Data bit 3"
    ui[4]: "Data bit 4"
    ui[5]: "Data bit 5"
    ui[6]: "Mode select bit 0"
    ui[7]: "Mode select bit 1"
    uo[0]: "Result bit 0"
    uo[1]: "Result bit 1"
    uo[2]: "Result bit 2"
    uo[3]: "Result bit 3"
    uo[4]: "Result bit 4"
    uo[5]: "Result bit 5"
    uo[6]: "Result bit 6"
    uo[7]: "Result bit 7"
    uio[0]: "Pipelined result bit 0 (output)"
    uio[1]: "Pipelined result bit 1 (output)"
    uio[2]: "Pipelined result bit 2 (output)"
    uio[3]: "Pipelined result bit 3 (output)"
    uio[4]: "Pipelined result bit 4 (output)"
    uio[5]: "Pipelined result bit 5 (output)"
    uio[6]: "Pipelined result bit 6 (output)"
    uio[7]: "Pipelined result bit 7 (output)"
